# Ambiente de desenvolvimento. Segredos no .env (modelo em .env.example).
name: avalia-sales

x-integracoes: &integracoes
  Pagarme__ChaveSecreta: ${PAGARME_CHAVE_SECRETA:?defina PAGARME_CHAVE_SECRETA no .env (sk_test_ em desenvolvimento)}
  Pagarme__RecebedorAvalia: ${PAGARME_RECEBEDOR_AVALIA:?defina PAGARME_RECEBEDOR_AVALIA no .env}
  Pagarme__SegredoDoWebhook: ${PAGARME_SEGREDO_DO_WEBHOOK:?defina PAGARME_SEGREDO_DO_WEBHOOK no .env}
  D4Sign__TokenApi: ${D4SIGN_TOKEN_API:?defina D4SIGN_TOKEN_API no .env}
  D4Sign__CryptKey: ${D4SIGN_CRYPT_KEY:-}
  D4Sign__SegredoHmac: ${D4SIGN_SEGREDO_HMAC:?defina D4SIGN_SEGREDO_HMAC no .env}
  D4Sign__Cofre: ${D4SIGN_COFRE:?defina D4SIGN_COFRE no .env}
  D4Sign__UrlDoWebhook: ${D4SIGN_URL_DO_WEBHOOK:?defina D4SIGN_URL_DO_WEBHOOK no .env}
  Plataforma__UrlPublica: ${PLATAFORMA_URL_PUBLICA:-http://127.0.0.1:8080}
  Plataforma__UrlDoPainel: ${PLATAFORMA_URL_DO_PAINEL:-http://127.0.0.1:5173}
  Plataforma__EmailDaOperadora: ${PLATAFORMA_EMAIL_DA_OPERADORA:?defina PLATAFORMA_EMAIL_DA_OPERADORA no .env}
  Resend__ChaveApi: ${RESEND_CHAVE_API:-}
  Resend__Remetente: ${RESEND_REMETENTE:-}
  Google__ChaveDoServidor: ${GOOGLE_CHAVE_DO_SERVIDOR:-}
  ConnectionStrings__Banco: Host=postgres;Database=avalia_sales;Username=avalia_app;Password=${PG_SENHA_APLICACAO}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: avalia_dono
      POSTGRES_PASSWORD: ${PG_SENHA_DONO:?defina PG_SENHA_DONO no .env}
      POSTGRES_DB: avalia_sales
      PG_SENHA_APLICACAO: ${PG_SENHA_APLICACAO:?defina PG_SENHA_APLICACAO no .env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalia_dono -d avalia_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda as migrations como dono do banco e termina; API e Worker só sobem depois.
  migrar:
    build:
      context: .
      target: api
    command: ["--migrar"]
    environment:
      ConnectionStrings__Dono: Host=postgres;Database=avalia_sales;Username=avalia_dono;Password=${PG_SENHA_DONO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      <<: *integracoes
      Jwt__Chave: ${JWT_CHAVE:?defina JWT_CHAVE no .env, com 32 caracteres ou mais}
    depends_on:
      migrar:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *integracoes
    depends_on:
      migrar:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  dados-postgres:
