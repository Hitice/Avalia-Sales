# Produção no VPS: Nginx com Let's Encrypt na frente, API, Worker, Postgres e
# backup diário. Só o Nginx publica porta. Segredos no .env do servidor (modelo
# em .env.example); a versão das imagens vem de VERSAO (o commit publicado), e
# voltar é subir de novo com a VERSAO anterior (docs/OPERACAO.md).
name: avalia-sales

# Log do Docker com teto: sem max-size o json-file cresce até encher o disco do VPS.
x-registro: &registro
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-integracoes: &integracoes
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Proxy__AtrasDoNginx: "true"
  Sentry__Dsn: ${SENTRY_DSN:-}
  # A versão no Sentry é o commit publicado: o erro aponta o commit suspeito e a versão em que começou.
  Sentry__Release: avalia-sales@${VERSAO:-local}
  Pagarme__ChaveSecreta: ${PAGARME_CHAVE_SECRETA:?defina PAGARME_CHAVE_SECRETA}
  Pagarme__RecebedorAvalia: ${PAGARME_RECEBEDOR_AVALIA:?defina PAGARME_RECEBEDOR_AVALIA}
  Pagarme__SegredoDoWebhook: ${PAGARME_SEGREDO_DO_WEBHOOK:?defina PAGARME_SEGREDO_DO_WEBHOOK}
  Pagarme__ChavePublica: ${PAGARME_CHAVE_PUBLICA:-}
  D4Sign__UrlBase: ${D4SIGN_URL_BASE:-https://sandbox.d4sign.com.br/api/v1/}
  # Obrigatória: o deploy para no build, antes de trocar os contêineres, se faltar. true enquanto a URL for a do sandbox (docs/OPERACAO.md).
  D4Sign__SandboxEmProducao: ${D4SIGN_SANDBOX_EM_PRODUCAO:?defina D4SIGN_SANDBOX_EM_PRODUCAO (true enquanto usar o sandbox da D4Sign)}
  D4Sign__TokenApi: ${D4SIGN_TOKEN_API:?defina D4SIGN_TOKEN_API}
  D4Sign__CryptKey: ${D4SIGN_CRYPT_KEY:-}
  D4Sign__SegredoHmac: ${D4SIGN_SEGREDO_HMAC:?defina D4SIGN_SEGREDO_HMAC}
  D4Sign__Cofre: ${D4SIGN_COFRE:?defina D4SIGN_COFRE}
  D4Sign__UrlDoWebhook: https://${DOMINIO}/webhooks/d4sign
  Plataforma__UrlPublica: https://${DOMINIO}
  Plataforma__UrlDoPainel: https://${DOMINIO}
  Plataforma__EmailDaOperadora: ${PLATAFORMA_EMAIL_DA_OPERADORA:?defina PLATAFORMA_EMAIL_DA_OPERADORA}
  Plataforma__RepresentanteDaAvalia: ${AVALIA_REPRESENTANTE:-}
  Plataforma__CargoDoRepresentante: ${AVALIA_CARGO_DO_REPRESENTANTE:-}
  Pdf__UrlDoConversor: http://gotenberg:3000
  Resend__ChaveApi: ${RESEND_CHAVE_API:-}
  Resend__Remetente: ${RESEND_REMETENTE:-}
  Resend__ResponderPara: ${RESEND_RESPONDER_PARA:-}
  # Igual na API e no Worker: cifra assunto e texto dos e-mails com link de senha ou código na fila.
  Seguranca__ChaveDosEmails: ${CHAVE_DOS_EMAILS:?defina CHAVE_DOS_EMAILS, 32 bytes em base64 (openssl rand -base64 32)}
  Seguranca__ChaveAnteriorDosEmails: ${CHAVE_ANTERIOR_DOS_EMAILS:-}
  Google__ChaveDoServidor: ${GOOGLE_CHAVE_DO_SERVIDOR:-}
  Google__ChaveDoMapa: ${GOOGLE_CHAVE_DO_MAPA:-}
  Google__IdDoMapa: ${GOOGLE_ID_DO_MAPA:-DEMO_MAP_ID}
  # Captcha do cadastro público: sem a chave secreta fica desligado. A chave do site (pública) vai no build do front, abaixo.
  Turnstile__ChaveSecreta: ${TURNSTILE_CHAVE_SECRETA:-}
  # Teto de e-mails do cadastro público por 24 horas, somando todos os endereços.
  Cadastro__EmailsPorDia: ${CADASTRO_EMAILS_POR_DIA:-300}
  Protheus__UrlBase: ${PROTHEUS_URL_BASE:-}
  Protheus__Usuario: ${PROTHEUS_USUARIO:-}
  Protheus__Senha: ${PROTHEUS_SENHA:-}
  ConnectionStrings__Banco: Host=postgres;Database=avalia_sales;Username=avalia_app;Password=${PG_SENHA_APLICACAO}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: avalia_dono
      POSTGRES_PASSWORD: ${PG_SENHA_DONO:?defina PG_SENHA_DONO}
      POSTGRES_DB: avalia_sales
      PG_SENHA_APLICACAO: ${PG_SENHA_APLICACAO:?defina PG_SENHA_APLICACAO}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalia_dono -d avalia_sales"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *registro
    cpu_shares: 2048

  migrar:
    image: avalia-sales-api:${VERSAO:-local}
    build:
      context: .
      target: api
    command: ["--migrar"]
    environment:
      ConnectionStrings__Dono: Host=postgres;Database=avalia_sales;Username=avalia_dono;Password=${PG_SENHA_DONO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *registro
    cpu_shares: 512

  api:
    image: avalia-sales-api:${VERSAO:-local}
    environment:
      <<: *integracoes
      Jwt__Chave: ${JWT_CHAVE:?defina JWT_CHAVE, com 32 caracteres ou mais}
    depends_on:
      migrar:
        condition: service_completed_successfully
    healthcheck:
      # A imagem aspnet não tem wget nem curl: a própria API confere o /health e sai.
      test: ["CMD", "dotnet", "AvaliaSales.Api.dll", "--saude"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *registro
    cpu_shares: 2048

  worker:
    image: avalia-sales-worker:${VERSAO:-local}
    build:
      context: .
      target: worker
    environment:
      <<: *integracoes
    depends_on:
      migrar:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
    restart: unless-stopped
    logging: *registro
    cpu_shares: 512

  gotenberg:
    # O PDF do contrato e do distrato (Chromium). Sem porta publicada; o Chromium
    # recusa endereço público e privado (CHROMIUM_DENY_*) e roda sem JavaScript: o
    # documento só usa os arquivos que o Worker manda junto.
    image: gotenberg/gotenberg:8.38.1-chromium
    environment:
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
      API_TIMEOUT: 60s
    restart: unless-stopped
    logging: *registro
    cpu_shares: 256

  nginx:
    image: avalia-sales-nginx:${VERSAO:-local}
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN_DO_FRONT:-}
        VITE_SENTRY_RELEASE: avalia-sales@${VERSAO:-local}
        VITE_TURNSTILE_CHAVE_SITE: ${TURNSTILE_CHAVE_SITE:-}
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO, como sales.avaliaone.com.br}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificados:/etc/letsencrypt
      - desafio-acme:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *registro
    cpu_shares: 2048

  # Renova o certificado duas vezes por dia; o Nginx relê a cada 6 horas.
  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - certificados:/etc/letsencrypt
      - desafio-acme:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    logging: *registro
    cpu_shares: 128

  # Cópia às 02:00 de Brasília no disco e, com BACKUP_PARA, por e-mail pelo Resend.
  backup:
    image: avalia-sales-backup:${VERSAO:-local}
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    environment:
      PGHOST: postgres
      PGUSER: avalia_dono
      PGPASSWORD: ${PG_SENHA_DONO}
      PGDATABASE: avalia_sales
      BACKUP_DIAS: ${BACKUP_DIAS:-14}
      BACKUP_PARA: ${BACKUP_PARA:-}
      # Obrigatória com BACKUP_PARA: o anexo sai criptografado, e sem ela o e-mail é desligado (a cópia no disco continua).
      BACKUP_SENHA: ${BACKUP_SENHA:-}
      RESEND_CHAVE_API: ${RESEND_CHAVE_API:-}
      RESEND_REMETENTE: ${RESEND_REMETENTE:-}
      # Cópia fora do VPS: qualquer bucket compatível com S3 (Cloudflare R2, Backblaze B2...). Exige BACKUP_SENHA.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY_ID: ${S3_KEY_ID:-}
      S3_APP_KEY: ${S3_APP_KEY:-}
      BACKUP_DIAS_NO_BUCKET: ${BACKUP_DIAS_NO_BUCKET:-30}
      # Alerta por e-mail (BACKUP_PARA) com o disco do VPS acima deste por cento.
      DISCO_ALERTA: ${DISCO_ALERTA:-85}
    volumes:
      - ${PASTA_DE_BACKUP:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *registro
    cpu_shares: 128

volumes:
  dados-postgres:
  certificados:
  desafio-acme:
