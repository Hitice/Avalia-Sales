name: Deploy

# Publica no VPS depois do CI verde no main, pelo runner próprio instalado no
# servidor. O ambiente "producao" pede aprovação no GitHub antes de rodar.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: SHA completo do commit, com 40 caracteres (git rev-parse <commit>); o abreviado falha no checkout. Vazio publica o último do main. Voltar é publicar o commit anterior.
        required: false

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Desligado até o VPS existir: ligue com a variável DEPLOY_ATIVO=true no repositório.
    # O runner fica no servidor e o repositório é público: só publica o CI verde
    # de um push no main deste repositório. Um pull request de fork também gera
    # workflow_run do CI, com a branch que o fork quiser, e não pode chegar aqui.
    if: >-
      vars.DEPLOY_ATIVO == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, linux, avalia-sales]
    environment:
      name: producao
      url: https://${{ vars.DOMINIO }}
    env:
      VERSAO: ${{ github.event.inputs.versao || github.event.workflow_run.head_sha || github.sha }}
      ENV_FILE: /srv/avalia-sales/.env
      # Quem assina pela Avalia, das variáveis do ambiente producao: o Compose lê do
      # ambiente antes do .env, e o nome não precisa ficar no servidor nem no repositório.
      AVALIA_REPRESENTANTE: ${{ vars.AVALIA_REPRESENTANTE }}
      AVALIA_CARGO_DO_REPRESENTANTE: ${{ vars.AVALIA_CARGO_DO_REPRESENTANTE }}
      # Captcha do cadastro (Cloudflare Turnstile): a chave do site entra no build do front e a secreta é lida
      # pela API. Vindas do ambiente producao, ficam fora do .env do servidor; vazias, o cadastro roda sem captcha.
      TURNSTILE_CHAVE_SITE: ${{ vars.TURNSTILE_CHAVE_SITE }}
      TURNSTILE_CHAVE_SECRETA: ${{ secrets.TURNSTILE_CHAVE_SECRETA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSAO }}

      # A VPS tem um núcleo e 4 GB: compilar a API, o Worker e o front ao mesmo tempo disputa CPU e RAM com
      # o site no ar. Uma imagem por vez deixa a API e o banco respondendo durante o build.
      - name: Imagens da versão
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
        run: docker compose -f docker-compose.producao.yml --env-file "$ENV_FILE" build

      # Cópia do banco antes de qualquer migration desta versão. Com o contêiner de
      # backup de pé, cópia que falha segura a publicação.
      - name: Cópia do banco antes de subir
        run: |
          if docker compose -f docker-compose.producao.yml --env-file "$ENV_FILE" ps --status running --services | grep -qx backup; then
            docker compose -f docker-compose.producao.yml --env-file "$ENV_FILE" exec -T backup sh /backup.sh agora
          else
            echo "::warning::Contêiner de backup parado: publicação sem cópia antes."
          fi

      # migrar roda antes de API e Worker (depends_on); migration é só aditiva, então a versão anterior continua lendo o banco.
      - name: Subir
        run: docker compose -f docker-compose.producao.yml --env-file "$ENV_FILE" up -d --remove-orphans

      - name: Conferir saúde pelo domínio
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DOMINIO }}/api/health" >/dev/null; then
              echo "no ar: $VERSAO"
              exit 0
            fi
            sleep 5
          done
          echo "::error::A API não respondeu /health depois de 150 s. Volte com o commit anterior (docs/OPERACAO.md)."
          docker compose -f docker-compose.producao.yml --env-file "$ENV_FILE" logs --tail 100 api
          exit 1

      # Cada versão deixa quatro imagens com a tag do commit, que o prune comum não
      # apaga. Ficam a que está no ar e a anterior; o cache de build guarda 7 dias.
      - name: Limpar imagens velhas
        if: success()
        run: |
          for imagem in avalia-sales-api avalia-sales-worker avalia-sales-nginx avalia-sales-backup; do
            docker image ls "$imagem" --format '{{.CreatedAt}}\t{{.Tag}}' | sort -r | cut -f2 \
              | grep -vx "$VERSAO" | tail -n +2 \
              | xargs -r -I{} docker image rm "$imagem:{}" || true
          done
          docker image prune -f
          docker builder prune -f --filter "until=168h"
          df -h / | tail -1
