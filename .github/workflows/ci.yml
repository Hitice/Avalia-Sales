name: CI

on:
  push:
    branches: [main]
    # Commit só de documento não muda o que roda: sem CI, também não abre deploy para aprovar.
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AVALIA_SALES_PG_ADMIN: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Os tipos do front saem do contrato da API (web/openapi.json, conferido pelo ContratoDaApiTest).
      - name: Tipos em dia com o contrato
        run: npm run tipos && git diff --exit-code src/api/esquema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      # O catálogo vivo precisa compilar: história quebrada falha aqui.
      - run: npm run build-storybook -- --quiet

  # Ponta a ponta a 390 px e no computador, com axe: o front compilado contra a
  # API de verdade e os dados da demonstração.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: API da demonstração
        run: web/e2e/api.sh
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: web/test-results/
          retention-days: 7

  # Segredo no código ou no histórico falha aqui. Falso positivo vai para o .gitleaksignore, com o motivo.
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SonarCloud só com o segredo SONAR_TOKEN e as variáveis SONAR_ORGANIZACAO e
  # SONAR_PROJETO; sem eles, o passo avisa e sai sem falhar.
  qualidade:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Análise no SonarCloud
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud pulada."
            exit 0
          fi
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          dotnet sonarscanner begin /o:"${{ vars.SONAR_ORGANIZACAO }}" /k:"${{ vars.SONAR_PROJETO }}" \
            /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="**/Migrations/**,web/**"
          dotnet build -c Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Código que muda sem o PDD ou o SDD acompanhar não entra. Refatoração sem
  # efeito visível passa com o rótulo sem-mudanca-de-doc.
  documentacao:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Documentação acompanha o código
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SEM_DOC: ${{ contains(github.event.pull_request.labels.*.name, 'sem-mudanca-de-doc') }}
        run: |
          mudou=$(git diff --name-only "$BASE"...HEAD)
          codigo=$(printf '%s\n' "$mudou" | grep -E '^(src|tests|infra|web/src)/|^(Dockerfile|docker-compose\.yml|Directory\.(Build|Packages)\.props)$' || true)
          docs=$(printf '%s\n' "$mudou" | grep -E '^docs/(PDD|SDD)\.md$' || true)
          if [ -n "$codigo" ] && [ -z "$docs" ] && [ "$SEM_DOC" != "true" ]; then
            echo "::error::Código mudou sem atualizar docs/PDD.md ou docs/SDD.md. Atualize o documento certo ou aplique o rótulo sem-mudanca-de-doc."
            printf '%s\n' "$codigo"
            exit 1
          fi
