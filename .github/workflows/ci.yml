name: CI

on:
  push:
    branches: [main]
    # Commit só de documento não muda o que roda: sem CI, também não abre deploy para aprovar.
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AVALIA_SALES_PG_ADMIN: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.403 já consta no índice da Microsoft, mas o download ainda não existe e quebrou o CI em 25/10/2026.
          # O global.json aceita qualquer 10.0.x (latestFeature); aqui o CI instala uma versão que se sabe baixar.
          dotnet-version: 10.0.402
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Sem script de instalação de dependência (só o esbuild e o fsevents têm, e
      # nenhum faz falta: o binário do esbuild vem no pacote opcional da plataforma).
      # Os binários rodam pelo npm run, da versão do package-lock, sem baixar nada.
      - run: npm ci --ignore-scripts
      # Os tipos do front saem do contrato da API (web/openapi.json, conferido pelo ContratoDaApiTest).
      - name: Tipos em dia com o contrato
        run: npm run tipos && git diff --exit-code src/api/esquema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      # O npm test roda os testes de unidade e cada história do Storybook no Chromium, com o axe em modo erro.
      - run: npm run navegador
      - run: npm test
      - run: npm run build
      # O catálogo vivo precisa compilar: história quebrada falha aqui.
      - run: npm run build-storybook -- --quiet

  # Ponta a ponta a 390 px e no computador, com axe: o front compilado contra a
  # API de verdade e os dados da demonstração.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.403 já consta no índice da Microsoft, mas o download ainda não existe e quebrou o CI em 25/10/2026.
          # O global.json aceita qualquer 10.0.x (latestFeature); aqui o CI instala uma versão que se sabe baixar.
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run navegador
        working-directory: web
      - name: API da demonstração
        run: web/e2e/api.sh
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: web/test-results/
          retention-days: 7

  # Segredo no código ou no histórico falha aqui. Falso positivo vai para o .gitleaksignore, com o motivo.
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SonarCloud só com o segredo SONAR_TOKEN e as variáveis SONAR_ORGANIZACAO e
  # SONAR_PROJETO; sem eles, o passo avisa e sai sem falhar. Analisa o C# e o
  # TypeScript do front, com a cobertura dos testes da API (rodam aqui contra um
  # Postgres de verdade, como no job api). Não bloqueia o merge: o portão de
  # qualidade aparece no SonarCloud e no pull request.
  qualidade:
    runs-on: ubuntu-latest
    # Falha da análise (SonarCloud fora do ar, token vencido) não pinta o CI de
    # vermelho: o Deploy só roda com o CI verde.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AVALIA_SALES_PG_ADMIN: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.403 já consta no índice da Microsoft, mas o download ainda não existe e quebrou o CI em 25/10/2026.
          # O global.json aceita qualquer 10.0.x (latestFeature); aqui o CI instala uma versão que se sabe baixar.
          dotnet-version: 10.0.402
      - name: Análise no SonarCloud
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud pulada."
            exit 0
          fi
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          dotnet tool install --global dotnet-coverage --version 18.12.0
          dotnet sonarscanner begin /o:"${{ vars.SONAR_ORGANIZACAO }}" /k:"${{ vars.SONAR_PROJETO }}" \
            /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
            /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**,web/node_modules/**,web/dist/**,web/storybook-static/**,web/public/**,web/src/api/esquema.d.ts,web/openapi.json,docs/contrato/**" \
            /d:sonar.coverage.exclusions="web/**,tests/**,infra/**"
          dotnet build -c Release --no-incremental
          dotnet-coverage collect "dotnet test --no-build -c Release" -f xml -o coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Código que muda sem o PDD ou o SDD acompanhar não entra. Refatoração sem
  # efeito visível passa com o rótulo sem-mudanca-de-doc.
  documentacao:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Documentação acompanha o código
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SEM_DOC: ${{ contains(github.event.pull_request.labels.*.name, 'sem-mudanca-de-doc') }}
        run: |
          mudou=$(git diff --name-only "$BASE"...HEAD)
          codigo=$(printf '%s\n' "$mudou" | grep -E '^(src|tests|infra|web/src)/|^(Dockerfile|docker-compose\.yml|Directory\.(Build|Packages)\.props)$' || true)
          docs=$(printf '%s\n' "$mudou" | grep -E '^docs/(PDD|SDD)\.md$' || true)
          if [ -n "$codigo" ] && [ -z "$docs" ] && [ "$SEM_DOC" != "true" ]; then
            echo "::error::Código mudou sem atualizar docs/PDD.md ou docs/SDD.md. Atualize o documento certo ou aplique o rótulo sem-mudanca-de-doc."
            printf '%s\n' "$codigo"
            exit 1
          fi
