name: CI

on:
  push:
    branches: [main]
    # Commit só de documento não muda o que roda: sem CI, também não abre deploy para aprovar.
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AVALIA_SALES_PG_ADMIN: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 10.0.403 já consta no índice da Microsoft, mas o download ainda não existe e quebrou o CI em 25/10/2026.
          # O global.json aceita qualquer 10.0.x (latestFeature); aqui o CI instala uma versão que se sabe baixar.
          dotnet-version: 10.0.402
      - run: dotnet restore
      - name: Fluxo do backup (e-mail e bucket juntos)
        run: sh infra/backup/teste-do-fluxo.sh
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Sem script de instalação de dependência (só o esbuild e o fsevents têm, e
      # nenhum faz falta: o binário do esbuild vem no pacote opcional da plataforma).
      # Os binários rodam pelo npm run, da versão do package-lock, sem baixar nada.
      - run: npm ci --ignore-scripts
      # Os tipos do front saem do contrato da API (web/openapi.json, conferido pelo ContratoDaApiTest).
      - name: Tipos em dia com o contrato
        run: npm run tipos && git diff --exit-code src/api/esquema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      # O npm test roda os testes de unidade e cada história do Storybook no Chromium, com o axe em modo erro.
      - run: npm run navegador
      - run: npm test
      - run: npm run build
      # O catálogo vivo precisa compilar: história quebrada falha aqui.
      - run: npm run build-storybook -- --quiet

  # Ponta a ponta a 390 px e no computador, com axe: o front compilado contra a
  # API de verdade e os dados da demonstração.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 10.0.403 já consta no índice da Microsoft, mas o download ainda não existe e quebrou o CI em 25/10/2026.
          # O global.json aceita qualquer 10.0.x (latestFeature); aqui o CI instala uma versão que se sabe baixar.
          dotnet-version: 10.0.402
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run navegador
        working-directory: web
      - name: API da demonstração
        run: web/e2e/api.sh
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Dependência com vulnerabilidade alta ou crítica conhecida falha aqui (NuGet, transitivas incluídas, e npm de produção).
  # Atualização de rotina é rodada manual no main; esta trava pega o que não pode esperar a próxima rodada.
  vulnerabilidades:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: dotnet restore
      - name: NuGet
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulneraveis.json
          graves=$(jq '[.projects[].frameworks[]?.[("topLevelPackages","transitivePackages")][]?.vulnerabilities[]? | select(.severity == "High" or .severity == "Critical")] | length' vulneraveis.json)
          jq -r '.projects[].frameworks[]?.[("topLevelPackages","transitivePackages")][]? | select(.vulnerabilities) | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"' vulneraveis.json
          if [ "$graves" -gt 0 ]; then echo "::error::$graves vulnerabilidade(s) alta(s) ou crítica(s) em pacote NuGet."; exit 1; fi
      - name: npm
        working-directory: web
        run: npm audit --audit-level=high --omit=dev

  # Análise estática pelas regras abertas do Semgrep (segurança e má prática em C#, TypeScript, React,
  # Dockerfile e Actions), sem ler documentação nem contexto do projeto. Falha com achado de severidade
  # ERROR; falso positivo conferido leva "nosemgrep" com o motivo, e o que não é código de produção
  # fica no .semgrepignore. O relatório completo, com os avisos, sai no log.
  semgrep:
    runs-on: ubuntu-24.04
    container: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: |
          regras="--config p/default --config p/csharp --config p/typescript --config p/react --config p/github-actions --config p/dockerfile"
          semgrep scan $regras --metrics off || true
          semgrep scan $regras --metrics off --severity ERROR --error --quiet

  # Segredo no código ou no histórico falha aqui. Falso positivo vai para o .gitleaksignore, com o motivo.
  segredos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SonarCloud só com o segredo SONAR_TOKEN e as variáveis SONAR_ORGANIZACAO e
  # SONAR_PROJETO; sem eles, o passo avisa e sai sem falhar. Analisa o C# e o
  # TypeScript do front, com a cobertura dos testes da API (rodam aqui contra um
  # Postgres de verdade, como no job api). Não bloqueia o merge: o portão de
  # qualidade aparece no SonarCloud e no pull request.
  qualidade:
    runs-on: ubuntu-24.04
    # Falha da análise (SonarCloud fora do ar, token vencido) não pinta o CI de
    # vermelho: o Deploy só roda com o CI verde.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AVALIA_SALES_PG_ADMIN: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 10.0.403 já consta no índice da Microsoft, mas o download ainda não existe e quebrou o CI em 25/10/2026.
          # O global.json aceita qualquer 10.0.x (latestFeature); aqui o CI instala uma versão que se sabe baixar.
          dotnet-version: 10.0.402
      - name: Análise no SonarCloud
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud pulada."
            exit 0
          fi
          # Falsos positivos conferidos: CSS do Tailwind (@utility aninhado), senha do
          # Postgres efêmero do CI, scripts de migração rodados pela operadora com
          # argumento dela, aleatório de teste e de demonstração (semente fixa), cookie
          # Secure fora do desenvolvimento, entidade gravada só por SQL (LeituraDoDia) e imagens oficiais nginx/postgres no usuário padrão.
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          dotnet tool install --global dotnet-coverage --version 18.12.0
          dotnet sonarscanner begin /o:"${{ vars.SONAR_ORGANIZACAO }}" /k:"${{ vars.SONAR_PROJETO }}" \
            /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
            /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**,web/node_modules/**,web/dist/**,web/storybook-static/**,web/public/**,web/src/api/esquema.d.ts,web/openapi.json,docs/contrato/**" \
            /d:sonar.coverage.exclusions="web/**,tests/**,infra/**,**/Program.cs,**/InjecaoDeDependencias.cs" \
            /d:sonar.issue.ignore.multicriteria=css1,css2,yaml1,py1,e2e1,demo1,cookie1,docker1,leitura1 \
            /d:sonar.issue.ignore.multicriteria.css1.ruleKey="css:S8776" \
            /d:sonar.issue.ignore.multicriteria.css1.resourceKey="web/src/index.css" \
            /d:sonar.issue.ignore.multicriteria.css2.ruleKey="css:S8767" \
            /d:sonar.issue.ignore.multicriteria.css2.resourceKey="web/src/index.css" \
            /d:sonar.issue.ignore.multicriteria.yaml1.ruleKey="yaml:S2068" \
            /d:sonar.issue.ignore.multicriteria.yaml1.resourceKey=".github/workflows/ci.yml" \
            /d:sonar.issue.ignore.multicriteria.py1.ruleKey="pythonsecurity:S8707" \
            /d:sonar.issue.ignore.multicriteria.py1.resourceKey="infra/migracao/**" \
            /d:sonar.issue.ignore.multicriteria.e2e1.ruleKey="typescript:S2245" \
            /d:sonar.issue.ignore.multicriteria.e2e1.resourceKey="web/e2e/**" \
            /d:sonar.issue.ignore.multicriteria.demo1.ruleKey="csharpsquid:S2245" \
            /d:sonar.issue.ignore.multicriteria.demo1.resourceKey="src/AvaliaSales.Api/Demonstracao.cs" \
            /d:sonar.issue.ignore.multicriteria.cookie1.ruleKey="csharpsquid:S2092" \
            /d:sonar.issue.ignore.multicriteria.cookie1.resourceKey="src/AvaliaSales.Api/Rotas/RotasDeAcesso.cs" \
            /d:sonar.issue.ignore.multicriteria.docker1.ruleKey="docker:S6471" \
            /d:sonar.issue.ignore.multicriteria.docker1.resourceKey="infra/**" \
            /d:sonar.issue.ignore.multicriteria.leitura1.ruleKey="csharpsquid:S3453" \
            /d:sonar.issue.ignore.multicriteria.leitura1.resourceKey="src/AvaliaSales.Domain/Placas/LeituraDoDia.cs"
          dotnet build -c Release --no-incremental
          dotnet-coverage collect "dotnet test --no-build -c Release" -f xml -o coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Código que muda sem o PDD ou o SDD acompanhar não entra, no push ao main e em pull request.
  # Refatoração sem efeito visível passa com [sem-doc] na mensagem do commit (ou o rótulo
  # sem-mudanca-de-doc no pull request). No push, a comparação é com o que estava no main antes.
  documentacao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Documentação acompanha o código
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SEM_DOC: ${{ contains(github.event.pull_request.labels.*.name, 'sem-mudanca-de-doc') || contains(github.event.head_commit.message, '[sem-doc]') }}
        run: |
          mudou=$(git diff --name-only "$BASE"...HEAD)
          codigo=$(printf '%s\n' "$mudou" | grep -E '^(src|tests|infra|web/src)/|^(Dockerfile|docker-compose(\.producao)?\.yml|Directory\.(Build|Packages)\.props)$' || true)
          docs=$(printf '%s\n' "$mudou" | grep -E '^docs/(PDD|SDD)\.md$' || true)
          if [ -n "$codigo" ] && [ -z "$docs" ] && [ "$SEM_DOC" != "true" ]; then
            echo "::error::Código mudou sem atualizar docs/PDD.md ou docs/SDD.md. Atualize o documento certo, ou use [sem-doc] no commit (rótulo sem-mudanca-de-doc no pull request) se não há efeito visível."
            printf '%s\n' "$codigo"
            exit 1
          fi
